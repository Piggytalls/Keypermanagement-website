# ==========================================================================
# Keyper SEO landing pages — one file, one page per entry.
#
# Edit this file, then run: python3 tools/build_site.py
# Each entry renders to <slug>.html via templates/landing.html.j2 and is
# added to sitemap.xml automatically. Never hand-edit the generated HTML.
#
# RULES — read before adding or editing a page:
#
# 1. NO page targets "property management Paphos". That is the homepage's
#    phrase. A second page aimed at it would compete with index.html for the
#    same query (keyword cannibalisation) and split the ranking signal
#    between two weaker pages instead of concentrating it on one strong one.
#    Area pages target "<service> <village>"; service pages target the
#    specific job. Keep it that way.
#
# 2. Copy must be genuinely different per page — not this page with the
#    village name swapped. Near-duplicate pages are treated as thin content
#    and can drag the whole domain down. Each page below leads with a
#    different real concern (winter damp, guest changeovers, pool plant,
#    project management from abroad) precisely so they don't collide.
#
# 3. Don't invent specifics. No client names, no property addresses, no
#    "we manage 200 villas", no review counts. Same rule as the homepage.
#
# 4. `related` drives the internal link block at the foot of each page.
#    Give every page 3 siblings so no page is orphaned.
# ==========================================================================

pages:

