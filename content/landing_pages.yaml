  - slug: damp-treatment-waterproofing-paphos
    kind: service
    area: Paphos
    service_type: "Damp Treatment and Waterproofing"
    title: "Damp Treatment & Waterproofing in Paphos, Cyprus | Keyper"
    description: "Damp treatment and waterproofing in Paphos. We trace the source, treat the affected walls and waterproof roofs, terraces and balconies so it stays gone."
    keywords: "damp treatment Paphos, damp proofing Cyprus, waterproofing Paphos, roof waterproofing Cyprus, mould treatment Paphos, rising damp Cyprus"
    eyebrow: "Damp & Waterproofing"
    h1: "Damp Treatment & Waterproofing in Paphos"
    lede: "Painting over damp hides it until spring. We find where the water is actually getting in, then stop it."
    intro_heading: "Why Cyprus properties get damp"
    intro_body:
      - "People are often surprised that damp is a problem in a place this dry. It's precisely because of how the year splits: a long hot season, then concentrated winter rain hitting flat roofs, terraces and balconies that have spent months baking and moving in the heat."
      - "Add a property closed up for months with no heating and no airflow, and you get the second cause — condensation. Warm damp air, cold external walls, no ventilation, and mould appears in corners, behind wardrobes and along the ceiling line without a drop of rain getting in."
      - "The two have completely different fixes, which is why diagnosis matters more than treatment."
    sections:
      - heading: "Diagnosis before treatment"
        body: "The mistake we're most often called in to undo is treating the stain instead of the cause. Sealed and repainted, it looks solved for a season and comes back worse."
        points:
          - "Establish whether it's ingress, plumbing, rising damp or condensation"
          - "Trace the actual entry point — often nowhere near the visible patch"
          - "Check roof, terrace, balcony and parapet detailing for failures"
          - "Rule out slow plumbing leaks behind walls and under floors"
          - "Photograph everything, so you can see the reasoning, not just the bill"
      - heading: "Treating the wall properly"
        body: "Once the source is dealt with, the affected structure has to be brought back — removing failed plaster where it needs removing, treating mould rather than painting over it, drying the substrate, then replastering and redecorating. Done in the right order it stays fixed; done in the wrong order you're repeating it next winter."
      - heading: "Waterproofing roofs, terraces and balconies"
        body: "Most water ingress we see in Paphos comes through horizontal surfaces and their edges — flat roofs, terrace floors, balcony junctions and parapet details, where heat movement has opened up membranes and seals. We waterproof these properly rather than patching, because a patched membrane simply fails at the next join along."
      - heading: "For owners who aren't in Cyprus"
        body: "Damp is exactly the problem that's worst to have remotely: invisible until it's serious, then quoted by someone you can't easily check. You get photographs of the diagnosis, a written quote before anything starts, and photographs of the finished work. If we find it during a routine inspection you'll usually hear about it the same day."
    faq:
      - question: "How do I know whether it's a leak or condensation?"
        answer: "Broadly, ingress tends to be localised and seasonal — a patch that appears or worsens after rain, often high on a wall or near a roof or terrace junction. Condensation is more general, appears in cold corners, behind furniture and along ceiling lines, and is worst in properties left shut up and unheated. They need opposite fixes, so it's worth establishing which before spending anything."
      - question: "Can you fix damp in a property I'm not able to visit?"
        answer: "Yes — that's most of this work. We diagnose, photograph, quote in writing, and photograph again on completion. Nothing starts without your approval."
      - question: "Will the damp come back?"
        answer: "Not if the cause was actually dealt with. That's why we spend time on diagnosis rather than going straight to treatment — treating the symptom is what produces the properties we get called back to, where damp has returned every winter for years through fresh paint."
      - question: "Do you waterproof flat roofs and terraces as well as treating walls?"
        answer: "Yes, and usually both are needed. Treating an internal wall while leaving the failed terrace membrane above it untouched means the wall is wet again by the following winter."
    related: [renovations-paphos, villa-management-paphos, property-management-tala]

