analytics:
  # Vercel Web Analytics. This is a static site with no bundler, so the
  # @vercel/analytics npm package (which is a React component) can't be used
  # — the supported path for non-framework projects is the first-party
  # script below, injected via templates/_head-assets.html.j2.
  #
  # It is cookieless and served from /_vercel/insights on this domain, so it
  # adds no third-party requests — which is why it doesn't undo the reason
  # the fonts are self-hosted (see workflows/build_landing_page.md).
  #
  # MUST ALSO be switched on in the Vercel dashboard:
  #   Project -> Analytics -> Web Analytics -> Enable
  # Without that the script 404s and no data is collected.
  #
  # Setting this to false removes the script from every page. If you do
  # that, revert the analytics wording in templates/privacy.html.j2 too.
  vercel_web_analytics: true

seo:
  title: "Keyper | Property Management in Paphos, Cyprus for Overseas Owners"
  # Keep under ~160 chars — Google truncates past that. tools/check_seo.py
  # enforces it. The long-tail place names live on the landing pages now.
  description: "Property management in Paphos, Cyprus for overseas villa owners — inspections, key holding, cleaning, pool and garden care, repairs and damp treatment."
  keywords: "property management Paphos, villa management Cyprus, key holding Paphos, holiday home care Paphos, property maintenance Cyprus, overseas homeowner services Paphos, renovations Paphos, home renovations Cyprus, small renovations Paphos, damp repair Paphos, damp proofing Cyprus, waterproofing Paphos, maintenance team Paphos"
  og_locale: en_GB
  geo_region: CY-04
  geo_placename: Paphos
  # Google Search Console verification. Paste ONLY the token here — the bit
  # inside content="..." from the HTML tag Google shows you, not the whole
  # tag. Leave empty and no meta tag is rendered at all.
  # Get it at: https://search.google.com/search-console
  #   Add property -> URL prefix -> https://www.keypermanagement.com
  #   -> "HTML tag" method -> copy the content value -> paste below
  #   -> python3 tools/build_site.py -> commit + push -> click Verify
  google_site_verification: ""

